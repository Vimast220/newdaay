          package com.realshrooms;
          import com.realshrooms.block.*; import com.realshrooms.item.MushroomItem; import net.fabricmc.api.ModInitializer; import net.fabricmc.fabric.api.command.v2.CommandRegistrationCallback; import net.fabricmc.fabric.api.event.lifecycle.v1.ServerTickEvents; import net.fabricmc.fabric.api.itemgroup.v1.FabricItemGroup; import net.minecraft.core.Registry; import net.minecraft.core.registries.BuiltInRegistries; import net.minecraft.network.chat.Component; import net.minecraft.resources.ResourceLocation; import net.minecraft.world.item.BlockItem; import net.minecraft.world.item.CreativeModeTab; import net.minecraft.world.item.Item; import net.minecraft.world.item.ItemStack; import net.minecraft.world.level.block.Block; import net.minecraft.world.level.block.SoundType; import net.minecraft.world.level.block.state.BlockBehaviour; import net.minecraft.world.level.material.MapColor; import org.slf4j.Logger; import org.slf4j.LoggerFactory; import java.util.HashMap; import java.util.Map;
          public class RealShrooms implements ModInitializer {
              public static final String MOD_ID = "realshrooms"; public static final Logger LOGGER = LoggerFactory.getLogger(MOD_ID);
              public static final Map<ShroomSpecies, Block> SHROOM_BLOCKS = new HashMap<>(); public static final Map<ShroomSpecies, Block> HYPHA_BLOCKS = new HashMap<>(); public static final Map<ShroomSpecies, Block> NODE_BLOCKS = new HashMap<>(); public static final Map<ShroomSpecies, Block> CORE_BLOCKS = new HashMap<>(); public static final Map<ShroomSpecies, Item> SHROOM_ITEMS = new HashMap<>(); public static CreativeModeTab SHROOM_TAB;
              @Override public void onInitialize() {
                  ShroomConfig.load();
                  for (ShroomSpecies sp : ShroomSpecies.values()) registerAll(sp);
                  SHROOM_TAB = Registry.register(BuiltInRegistries.CREATIVE_MODE_TAB, new ResourceLocation(MOD_ID, "shrooms"), FabricItemGroup.builder().icon(() -> new ItemStack(SHROOM_ITEMS.get(ShroomSpecies.CHANTERELLE))).title(Component.translatable("itemGroup.realshrooms.shrooms")).displayItems((ctx, entries) -> { for (ShroomSpecies sp : ShroomSpecies.values()) { entries.accept(SHROOM_ITEMS.get(sp)); entries.accept(HYPHA_BLOCKS.get(sp)); entries.accept(NODE_BLOCKS.get(sp)); entries.accept(CORE_BLOCKS.get(sp)); } }).build());
                  CommandRegistrationCallback.EVENT.register((d, r, e) -> DebugCommand.register(d));
                  ServerTickEvents.END_WORLD_TICK.register(ColonyTicker::tick); ServerTickEvents.END_WORLD_TICK.register(GrazingHandler::tick);
                  LOGGER.info("RealShrooms 3.0.0 loaded!");
              }
              private static void registerAll(ShroomSpecies sp) {
                  Block shroom = new ShroomBlock(sp, BlockBehaviour.Properties.of().mapColor(MapColor.PLANT).noCollission().instabreak().sound(SoundType.GRASS).randomTicks()); Registry.register(BuiltInRegistries.BLOCK, id(sp.id + "_shroom"), shroom); SHROOM_BLOCKS.put(sp, shroom);
                  Block hypha = new MyceliumHyphaBlock(sp, BlockBehaviour.Properties.of().mapColor(MapColor.DIRT).strength(0.5f).randomTicks()); Registry.register(BuiltInRegistries.BLOCK, id(sp.id + "_hypha"), hypha); HYPHA_BLOCKS.put(sp, hypha);
                  Block node = new MyceliumNodeBlock(sp, BlockBehaviour.Properties.of().mapColor(MapColor.DIRT).strength(1.0f).randomTicks()); Registry.register(BuiltInRegistries.BLOCK, id(sp.id + "_node"), node); NODE_BLOCKS.put(sp, node);
                  Block core = new MyceliumCoreBlock(sp, BlockBehaviour.Properties.of().mapColor(MapColor.DIRT).strength(2.0f).randomTicks()); Registry.register(BuiltInRegistries.BLOCK, id(sp.id + "_core"), core); CORE_BLOCKS.put(sp, core);
                  Item shroomItem = new MushroomItem(sp, shroom, new Item.Properties()); Registry.register(BuiltInRegistries.ITEM, id(sp.id + "_shroom"), shroomItem); SHROOM_ITEMS.put(sp, shroomItem);
                  Registry.register(BuiltInRegistries.ITEM, id(sp.id + "_hypha"), new BlockItem(hypha, new Item.Properties())); Registry.register(BuiltInRegistries.ITEM, id(sp.id + "_node"), new BlockItem(node, new Item.Properties())); Registry.register(BuiltInRegistries.ITEM, id(sp.id + "_core"), new BlockItem(core, new Item.Properties()));
              }
              private static ResourceLocation id(String p) { return new ResourceLocation(MOD_ID, p); }
          }
