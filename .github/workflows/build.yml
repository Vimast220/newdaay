          cat > src/main/java/com/realshrooms/block/MyceliumHyphaBlock.java << '__EOF__'
          package com.realshrooms.block;
          import com.realshrooms.*; import net.minecraft.core.BlockPos; import net.minecraft.core.Direction; import net.minecraft.server.level.ServerLevel; import net.minecraft.util.RandomSource; import net.minecraft.world.level.block.Block; import net.minecraft.world.level.block.Blocks; import net.minecraft.world.level.block.state.BlockState; import net.minecraft.world.level.block.state.StateDefinition; import net.minecraft.world.level.block.state.properties.EnumProperty; import net.minecraft.world.level.block.state.properties.IntegerProperty;
          public class MyceliumHyphaBlock extends Block {
              public static final EnumProperty<Host> HOST = EnumProperty.create("host", Host.class); public static final IntegerProperty VIGOR = IntegerProperty.create("vigor", 0, 7);
              private final ShroomSpecies species; public MyceliumHyphaBlock(ShroomSpecies sp, Properties p) { super(p); this.species = sp; registerDefaultState(stateDefinition.any().setValue(HOST, Host.DIRT).setValue(VIGOR, 3)); }
              public ShroomSpecies species() { return species; }
              @Override protected void createBlockStateDefinition(StateDefinition.Builder<Block, BlockState> b) { b.add(HOST, VIGOR); }
              @Override public void randomTick(BlockState state, ServerLevel lvl, BlockPos pos, RandomSource rng) {
                  ShroomConfig cfg = ShroomConfig.INSTANCE; int vigor = state.getValue(VIGOR);
                  if (rng.nextInt(100) < (8 - vigor) * 4) { if (vigor <= 0) { lvl.removeBlock(pos, false); return; } lvl.setBlock(pos, state.setValue(VIGOR, vigor - 1), 3); }
                  if (vigor >= 2 && rng.nextFloat() < cfg.spreadSpeed * species.spreadSpeed) { BlockPos target = bestTarget(lvl, pos, rng); if (target != null) spreadTo(lvl, target, vigor - 1); }
              }
              private BlockPos bestTarget(ServerLevel lvl, BlockPos pos, RandomSource rng) {
                  BlockPos best = null; double bestScore = -1;
                  for (Direction d : Direction.values()) { BlockPos n = pos.relative(d); BlockState s = lvl.getBlockState(n); double score = 0;
                      if (s.is(Blocks.WATER)) score += 3; else if (s.is(Blocks.GRASS_BLOCK) || s.is(Blocks.PODZOL) || s.is(Blocks.DIRT)) score += 2;
                      else if ((s.is(Blocks.STONE) || s.is(Blocks.DEEPSLATE)) && ShroomConfig.INSTANCE.captureStone) score += 1;
                      else if ((s.is(Blocks.SAND) || s.is(Blocks.GRAVEL)) && ShroomConfig.INSTANCE.captureSand) score += 1;
                      else if (s.is(net.minecraft.tags.BlockTags.LOGS) && ShroomConfig.INSTANCE.captureWood) score += 2;
                      else if (s.getBlock() instanceof MyceliumHyphaBlock hy && hy.species() != species && ShroomConfig.INSTANCE.warsEnabled) score += 4;
                      else if (s.isAir()) score += 0.05; else score -= 3;
                      score += rng.nextDouble() * 0.3; if (score > bestScore) { bestScore = score; best = n; } } return best;
              }
              private void spreadTo(ServerLevel lvl, BlockPos pos, int newVigor) {
                  BlockState existing = lvl.getBlockState(pos);
                  if (existing.getBlock() instanceof MyceliumHyphaBlock hy) { if (hy.species() != species && ShroomConfig.INSTANCE.warsEnabled) war(lvl, pos, existing); return; }
                  Host h = Host.fromVanilla(existing.getBlock()); if (h == null) return;
                  if (existing.is(net.minecraft.tags.BlockTags.LOGS) && !ShroomConfig.INSTANCE.captureWood) return;
                  if ((existing.is(Blocks.STONE) || existing.is(Blocks.DEEPSLATE)) && !ShroomConfig.INSTANCE.captureStone) return;
                  if ((existing.is(Blocks.SAND) || existing.is(Blocks.GRAVEL)) && !ShroomConfig.INSTANCE.captureSand) return;
                  if (!ColonyData.spend(lvl, pos, species, 1)) return;
                  lvl.setBlock(pos, RealShrooms.HYPHA_BLOCKS.get(species).defaultBlockState().setValue(HOST, h).setValue(VIGOR, Math.max(0, Math.min(7, newVigor))), 3);
              }
              private void war(ServerLevel lvl, BlockPos pos, BlockState existing) {
                  MyceliumHyphaBlock enemy = (MyceliumHyphaBlock) existing.getBlock(); var mine = ColonyData.merged(lvl, pos, species); var theirs = ColonyData.merged(lvl, pos, enemy.species());
                  int myPower = existing.getValue(VIGOR) + mine.aggression * 2 + lvl.getRandom().nextInt(3); int theirPower = existing.getValue(VIGOR) + theirs.resistance * 2 + lvl.getRandom().nextInt(3);
                  if (myPower > theirPower) { if (ColonyData.spend(lvl, pos, species, 1)) { lvl.setBlock(pos, RealShrooms.HYPHA_BLOCKS.get(species).defaultBlockState().setValue(HOST, existing.getValue(HOST)).setValue(VIGOR, Math.max(0, existing.getValue(VIGOR) - 1)), 3); ColonyData.addPoints(lvl, pos, species, 1); } }
                  else { if (ColonyData.spend(lvl, pos, enemy.species(), 1)) lvl.setBlock(pos, existing.setValue(VIGOR, Math.min(7, existing.getValue(VIGOR) + 1)), 3); }
              }
          }
          __EOF__
