          package com.realshrooms.item;
          import com.realshrooms.ShroomSpecies; import net.minecraft.world.InteractionHand; import net.minecraft.world.InteractionResultHolder; import net.minecraft.world.entity.LivingEntity; import net.minecraft.world.entity.player.Player; import net.minecraft.world.food.FoodProperties; import net.minecraft.world.item.BlockItem; import net.minecraft.world.item.ItemStack; import net.minecraft.world.level.Level; import net.minecraft.world.level.block.Block;
          public class MushroomItem extends BlockItem {
              private final ShroomSpecies species; public MushroomItem(ShroomSpecies sp, Block block, Properties props) { super(block, sp.edible ? props.food(new FoodProperties.Builder().nutrition(3).saturationMod(0.4f).alwaysEat().build()) : props); this.species = sp; }
              @Override public InteractionResultHolder<ItemStack> use(Level level, Player player, InteractionHand hand) { if (species.edible) { player.startUsingItem(hand); return InteractionResultHolder.consume(player.getItemInHand(hand)); } return super.use(level, player, hand); }
              @Override public ItemStack finishUsingItem(ItemStack stack, Level level, LivingEntity entity) { ItemStack result = super.finishUsingItem(stack, level, entity); if (species.effect != null && !level.isClientSide) entity.addEffect(species.effect.get()); return result; }
          }
