name: Build RealShrooms Full

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: pip install pillow

      - name: Generate Assets (Textures, Models, Lang, WorldGen)
        run: |
          python3 - << 'PYEOF'
          import os, json
          from PIL import Image, ImageDraw

          SPECIES = {
              "chanterelle": (232, 160, 32),
              "porcini": (216, 200, 160),
              "morel": (139, 111, 60),
              "fly_agaric": (200, 32, 32),
              "death_cap": (232, 224, 200),
              "inky_cap": (60, 60, 74),
              "mycena": (168, 216, 200),
              "honey_fungus": (200, 160, 64),
          }

          UK_NAMES = {
              "chanterelle": "Лисичка", "porcini": "Білий гриб", "morel": "Зморшок",
              "fly_agaric": "Мухомор", "death_cap": "Бліда поганка", "inky_cap": "Чорнильний гнойовик",
              "mycena": "Мицена хлорофос", "honey_fungus": "Опеньок осінній"
          }

          os.makedirs("src/main/resources/assets/realshrooms/textures/block", exist_ok=True)
          os.makedirs("src/main/resources/assets/realshrooms/textures/item", exist_ok=True)
          os.makedirs("src/main/resources/assets/realshrooms/models/block", exist_ok=True)
          os.makedirs("src/main/resources/assets/realshrooms/models/item", exist_ok=True)
          os.makedirs("src/main/resources/assets/realshrooms/blockstates", exist_ok=True)
          os.makedirs("src/main/resources/assets/realshrooms/lang", exist_ok=True)
          os.makedirs("src/main/resources/data/realshrooms/worldgen/configured_feature", exist_ok=True)
          os.makedirs("src/main/resources/data/realshrooms/worldgen/placed_feature", exist_ok=True)
          os.makedirs("src/main/resources/data/realshrooms/worldgen/biome_modifier", exist_ok=True)

          lang_en, lang_uk = {}, {"itemGroup.realshrooms.shrooms": "Real Shrooms"}

          for sp, color in SPECIES.items():
              # Текстури
              img = Image.new("RGBA", (16, 16), (0,0,0,0))
              d = ImageDraw.Draw(img)
              d.ellipse([3,2,13,8], fill=color+(255,), outline=(0,0,0,255))
              d.rectangle([7,8,9,14], fill=(230,220,200,255), outline=(0,0,0,255))
              img.save(f"src/main/resources/assets/realshrooms/textures/block/{sp}_shroom.png")
              img.save(f"src/main/resources/assets/realshrooms/textures/item/{sp}_shroom.png")
              
              img2 = Image.new("RGBA", (16, 16), (80,60,40,255))
              d2 = ImageDraw.Draw(img2)
              for i in range(16):
                  if i % 3 == 0: d2.line([(i,0),(i,16)], fill=(255,255,255,180), width=1)
              img2.save(f"src/main/resources/assets/realshrooms/textures/block/{sp}_hypha.png")
              
              # Використовуємо multipart, щоб гра не крашилась через властивості (вік, сила)
              with open(f"src/main/resources/assets/realshrooms/blockstates/{sp}_shroom.json", "w") as f:
                  json.dump({"multipart": [{"apply": {"model": f"realshrooms:block/{sp}_shroom"}}]}, f)
              with open(f"src/main/resources/assets/realshrooms/models/block/{sp}_shroom.json", "w") as f:
                  json.dump({"parent": "minecraft:block/cross", "textures": {"cross": f"realshrooms:block/{sp}_shroom"}}, f)
              with open(f"src/main/resources/assets/realshrooms/models/item/{sp}_shroom.json", "w") as f:
                  json.dump({"parent": "item/generated", "textures": {"layer0": f"realshrooms:item/{sp}_shroom"}}, f)
              
              for suffix in ["hypha", "node", "core"]:
                  with open(f"src/main/resources/assets/realshrooms/blockstates/{sp}_{suffix}.json", "w") as f:
                      json.dump({"multipart": [{"apply": {"model": f"realshrooms:block/{sp}_hypha"}}]}, f)
                  with open(f"src/main/resources/assets/realshrooms/models/block/{sp}_{suffix}.json", "w") as f:
                      json.dump({"parent": "minecraft:block/cube_all", "textures": {"all": f"realshrooms:block/{sp}_hypha"}}, f)
                  with open(f"src/main/resources/assets/realshrooms/models/item/{sp}_{suffix}.json", "w") as f:
                      json.dump({"parent": f"realshrooms:block/{sp}_hypha"}, f)

              lang_en[f"block.realshrooms.{sp}_shroom"] = sp.replace("_", " ").title()
              lang_en[f"block.realshrooms.{sp}_hypha"] = "Mycelium"
              lang_en[f"itemGroup.realshrooms.shrooms"] = "Real Shrooms"
              lang_uk[f"block.realshrooms.{sp}_shroom"] = UK_NAMES[sp]
              lang_uk[f"block.realshrooms.{sp}_hypha"] = "Грибниця"
              
              # Генерація в лісі
              with open(f"src/main/resources/data/realshrooms/worldgen/configured_feature/{sp}_shroom.json", "w") as f:
                  json.dump({"type": "minecraft:random_patch", "config": {"tries": 32, "xz_spread": 5, "y_spread": 3, "feature": {"feature": "minecraft:simple_block", "config": {"to_place": {"type": "minecraft:simple_state_provider", "state": {"Name": f"realshrooms:{sp}_shroom"}}}}}}, f)
              with open(f"src/main/resources/data/realshrooms/worldgen/placed_feature/{sp}_shroom.json", "w") as f:
                  json.dump({"feature": f"realshrooms:{sp}_shroom", "placement": [{"type": "minecraft:count", "count": 5}, {"type": "minecraft:in_square"}, {"type": "minecraft:heightmap", "heightmap": "MOTION_BLOCKING"}, {"type": "minecraft:biome"}]}, f)
              with open(f"src/main/resources/data/realshrooms/worldgen/biome_modifier/{sp}_shroom.json", "w") as f:
                  json.dump({"type": "minecraft:add_features", "biomes": "#minecraft:is_forest", "features": f"realshrooms:{sp}_shroom", "step": "vegetal_decoration"}, f)

          with open("src/main/resources/assets/realshrooms/lang/en_us.json", "w") as f: json.dump(lang_en, f, indent=2)
          with open("src/main/resources/assets/realshrooms/lang/uk_ua.json", "w") as f: json.dump(lang_uk, f, indent=2)
          PYEOF

      - name: Setup directories
        run: |
          mkdir -p src/main/java/com/realshrooms/block
          mkdir -p src/main/java/com/realshrooms/item

      - name: Gradle files
        run: |
          cat > build.gradle << '__EOF__'
          plugins {
              id 'fabric-loom' version '1.6-SNAPSHOT'
              id 'maven-publish'
          }
          version = '3.0.0'
          group = 'com.realshrooms'
          base { archivesName = 'realshrooms' }
          repositories {
              maven { url = 'https://maven.fabricmc.net/' }
              mavenCentral()
          }
          dependencies {
              minecraft 'com.mojang:minecraft:1.20.1'
              mappings loom.officialMojangMappings()
              modImplementation 'net.fabricmc:fabric-loader:0.15.11'
              modImplementation 'net.fabricmc.fabric-api:fabric-api:0.92.2+1.20.1'
          }
          processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand 'version': project.version } }
          tasks.withType(JavaCompile).configureEach { it.options.release = 17 }
          __EOF__
          cat > settings.gradle << '__EOF__'
          pluginManagement {
              repositories {
                  maven { url = 'https://maven.fabricmc.net/' }
                  gradlePluginPortal()
              }
          }
          rootProject.name = 'realshrooms'
          __EOF__
          cat > gradle.properties << '__EOF__'
          org.gradle.jvmargs=-Xmx2G
          org.gradle.parallel=true
          __EOF__

      - name: fabric.mod.json
        run: |
          cat > src/main/resources/fabric.mod.json << '__EOF__'
          {
            "schemaVersion": 1,
            "id": "realshrooms",
            "version": "${version}",
            "name": "RealShrooms",
            "description": "Fully functional mushroom ecosystem",
            "authors": ["Vimast220"],
            "license": "MIT",
            "environment": "*",
            "entrypoints": {
              "main": ["com.realshrooms.RealShrooms"],
              "client": ["com.realshrooms.RealShroomsClient"]
            },
            "depends": {
              "fabricloader": ">=0.15.0",
              "fabric-api": "*",
              "minecraft": "~1.20.1",
              "java": ">=17"
            }
          }
          __EOF__

      - name: Core classes
        run: |
          cat > src/main/java/com/realshrooms/ShroomSpecies.java << '__EOF__'
          package com.realshrooms;
          import net.minecraft.world.effect.MobEffectInstance;
          import net.minecraft.world.effect.MobEffects;
          import java.util.function.Supplier;
          public enum ShroomSpecies {
              CHANTERELLE("chanterelle", "Лисичка", 0xE8A020, true, null, FeedingType.TREE, false, 0.8f, new String[]{"forest", "taiga"}),
              PORCINI("porcini", "Білий гриб", 0xD8C8A0, true, null, FeedingType.TREE, false, 1.0f, new String[]{"forest", "taiga"}),
              MOREL("morel", "Зморшок", 0x8B6F3C, false, null, FeedingType.PLANTS, false, 0.6f, new String[]{"forest", "birch_forest"}),
              FLY_AGARIC("fly_agaric", "Мухомор", 0xC82020, false, () -> new MobEffectInstance(MobEffects.HUNGER, 200, 0), FeedingType.TREE, false, 1.0f, new String[]{"forest", "taiga"}),
              DEATH_CAP("death_cap", "Бліда поганка", 0xE8E0C8, false, () -> new MobEffectInstance(MobEffects.POISON, 200, 1), FeedingType.TREE, false, 0.5f, new String[]{"forest", "swamp"}),
              INKY_CAP("inky_cap", "Чорнильний гнойовик", 0x3C3C4A, true, null, FeedingType.PLANTS, false, 1.2f, new String[]{"swamp", "plains"}),
              MYCENA("mycena", "Мицена хлорофос", 0xA8D8C8, false, null, FeedingType.PLANTS, false, 0.4f, new String[]{"jungle", "swamp"}),
              HONEY_FUNGUS("honey_fungus", "Опеньок осінній", 0xC8A040, false, () -> new MobEffectInstance(MobEffects.POISON, 100, 0), FeedingType.PARASITE, true, 1.4f, new String[]{"forest", "dark_forest"});
              public enum FeedingType { TREE, PLANTS, PARASITE }
              public final String id; public final String displayName; public final int color; public final boolean edible; public final Supplier<MobEffectInstance> effect; public final FeedingType feeding; public final boolean isParasite; public final float spreadSpeed; public final String[] biomes;
              ShroomSpecies(String id, String name, int color, boolean edible, Supplier<MobEffectInstance> effect, FeedingType feeding, boolean parasite, float spread, String[] biomes) { this.id = id; this.displayName = name; this.color = color; this.edible = edible; this.effect = effect; this.feeding = feeding; this.isParasite = parasite; this.spreadSpeed = spread; this.biomes = biomes; }
              public static ShroomSpecies byId(String id) { for (ShroomSpecies s : values()) if (s.id.equals(id)) return s; return CHANTERELLE; }
          }
          __EOF__
          cat > src/main/java/com/realshrooms/ShroomConfig.java << '__EOF__'
          package com.realshrooms;
          import com.google.gson.Gson; import com.google.gson.GsonBuilder; import net.fabricmc.loader.api.FabricLoader; import java.nio.file.Files; import java.nio.file.Path;
          public final class ShroomConfig {
              private static final Gson GSON = new GsonBuilder().setPrettyPrinting().create();
              public float spreadSpeed = 1.0f; public float upkeepScale = 1.0f; public float hyphaLifespan = 1.0f; public int maxColonyBlocks = 300;
              public boolean captureStone = true; public boolean captureWood = true; public boolean captureSand = true; public boolean warsEnabled = true; public boolean parasiteEnabled = true; public boolean animalsEnabled = true; public boolean debugEnabled = true;
              public static ShroomConfig INSTANCE = new ShroomConfig();
              public static void load() { Path p = FabricLoader.getInstance().getConfigDir().resolve("realshrooms.json"); try { if (Files.exists(p)) { ShroomConfig loaded = GSON.fromJson(Files.readString(p), ShroomConfig.class); if (loaded != null) INSTANCE = loaded; } else { Files.writeString(p, GSON.toJson(INSTANCE)); } } catch (Exception e) { RealShrooms.LOGGER.error("Config error", e); } }
              public ShroomConfig() {}
          }
          __EOF__
          cat > src/main/java/com/realshrooms/Host.java << '__EOF__'
          package com.realshrooms;
          import net.minecraft.util.StringRepresentable; import net.minecraft.world.level.block.Block; import net.minecraft.world.level.block.Blocks;
          public enum Host implements StringRepresentable {
              DIRT("dirt", Blocks.DIRT), GRASS("grass", Blocks.GRASS_BLOCK), PODZOL("podzol", Blocks.PODZOL), STONE("stone", Blocks.STONE), DEEPSLATE("deepslate", Blocks.DEEPSLATE), SAND("sand", Blocks.SAND), GRAVEL("gravel", Blocks.GRAVEL), OAK_LOG("oak_log", Blocks.OAK_LOG), BIRCH_LOG("birch_log", Blocks.BIRCH_LOG), SPRUCE_LOG("spruce_log", Blocks.SPRUCE_LOG), JUNGLE_LOG("jungle_log", Blocks.JUNGLE_LOG), ACACIA_LOG("acacia_log", Blocks.ACACIA_LOG), DARK_OAK_LOG("dark_oak_log", Blocks.DARK_OAK_LOG), MANGROVE_LOG("mangrove_log", Blocks.MANGROVE_LOG), CHERRY_LOG("cherry_log", Blocks.CHERRY_LOG);
              public final String id; public final Block vanilla;
              Host(String id, Block vanilla) { this.id = id; this.vanilla = vanilla; }
              @Override public String getSerializedName() { return id; }
              public static Host fromVanilla(Block b) { for (Host h : values()) if (h.vanilla == b) return h; return null; }
              public boolean isWood() { return id.endsWith("_log"); }
          }
          __EOF__

      - name: Colony logic
        run: |
          cat > src/main/java/com/realshrooms/ColonyData.java << '__EOF__'
          package com.realshrooms;
          import net.minecraft.core.BlockPos; import net.minecraft.nbt.CompoundTag; import net.minecraft.server.level.ServerLevel; import java.util.*;
          public final class ColonyData {
              public static final int MAX_TOTAL_LEVELS = 6; public static final int MAX_FOOD = 60; public static final int START_FOOD = 30; public static final int MAX_POINTS = 200;
              public static final class Colony { public ShroomSpecies species; public int points; public int expansion, fruiting, resistance, aggression; public int strategy = 0; public int totalLevels() { return expansion + fruiting + resistance + aggression; } }
              private static final Map<String, Colony> colonies = new HashMap<>(); private static final Map<String, Integer> food = new HashMap<>();
              private static String key(ServerLevel l, BlockPos p, ShroomSpecies sp) { return l.dimension().location() + "|" + Math.floorDiv(p.getX(), 32) + "|" + Math.floorDiv(p.getZ(), 32) + "|" + sp.id; }
              private static String foodKey(ServerLevel l, BlockPos p) { return l.dimension().location() + "|" + Math.floorDiv(p.getX(), 32) + "|" + Math.floorDiv(p.getZ(), 32); }
              public static Colony colonyFor(ServerLevel l, BlockPos p, ShroomSpecies sp) { return colonies.computeIfAbsent(key(l, p, sp), k -> { Colony c = new Colony(); c.species = sp; return c; }); }
              public static Colony merged(ServerLevel l, BlockPos p, ShroomSpecies sp) { Colony t = new Colony(); t.species = sp; int rx = Math.floorDiv(p.getX(), 32), rz = Math.floorDiv(p.getZ(), 32); for (int dx = -1; dx <= 1; dx++) for (int dz = -1; dz <= 1; dz++) { Colony c = colonies.get(l.dimension().location() + "|" + (rx + dx) + "|" + (rz + dz) + "|" + sp.id); if (c == null) continue; t.points += c.points; t.expansion = Math.max(t.expansion, c.expansion); t.fruiting = Math.max(t.fruiting, c.fruiting); t.resistance = Math.max(t.resistance, c.resistance); t.aggression = Math.max(t.aggression, c.aggression); t.strategy = Math.max(t.strategy, c.strategy); } return t; }
              public static boolean spend(ServerLevel l, BlockPos p, ShroomSpecies sp, int amount) { int rx = Math.floorDiv(p.getX(), 32), rz = Math.floorDiv(p.getZ(), 32); List<Colony> list = new ArrayList<>(); for (int dx = -1; dx <= 1; dx++) for (int dz = -1; dz <= 1; dz++) { Colony c = colonies.get(l.dimension().location() + "|" + (rx + dx) + "|" + (rz + dz) + "|" + sp.id); if (c != null && c.points > 0) list.add(c); } int have = list.stream().mapToInt(c -> c.points).sum(); if (have < amount) return false; list.sort((a, b) -> Integer.compare(b.points, a.points)); for (Colony c : list) { int take = Math.min(amount, c.points); c.points -= take; amount -= take; if (amount == 0) break; } return true; }
              public static void addPoints(ServerLevel l, BlockPos p, ShroomSpecies sp, int n) { Colony c = colonyFor(l, p, sp); c.points = Math.max(0, Math.min(MAX_POINTS, c.points + n)); }
              public static boolean tryUpgrade(ServerLevel l, BlockPos p, ShroomSpecies sp) { Colony c = merged(l, p, sp); if (c.totalLevels() >= MAX_TOTAL_LEVELS) return false; int[] order = c.strategy == 2 ? new int[]{3,2,1,0} : c.strategy == 1 ? new int[]{2,3,0,1} : c.strategy == 3 ? new int[]{0,1,2,3} : new int[]{0,1,3,2}; for (int idx : order) { int cur = idx == 0 ? c.expansion : idx == 1 ? c.fruiting : idx == 2 ? c.resistance : c.aggression; if (cur >= 3) continue; int price = cur == 0 ? 12 : cur == 1 ? 25 : 45; if (!spend(l, p, sp, price)) continue; Colony t = colonyFor(l, p, sp); if (idx == 0) t.expansion++; else if (idx == 1) t.fruiting++; else if (idx == 2) t.resistance++; else t.aggression++; return true; } return false; }
              public static int foodAt(ServerLevel l, BlockPos p) { return food.getOrDefault(foodKey(l, p), START_FOOD); }
              public static void consumeFood(ServerLevel l, BlockPos p, int n) { food.merge(foodKey(l, p), -Math.max(0, n), Integer::sum); }
              public static void regenFood(ServerLevel l) { var r = l.getRandom(); for (String k : new HashSet<>(food.keySet())) { int v = food.getOrDefault(k, START_FOOD) + r.nextInt(3); food.put(k, Math.min(MAX_FOOD, v)); } }
              private ColonyData() {}
          }
          __EOF__
          cat > src/main/java/com/realshrooms/ColonyTicker.java << '__EOF__'
          package com.realshrooms;
          import net.minecraft.server.level.ServerLevel;
          public final class ColonyTicker { public static void tick(ServerLevel level) { if (level.getGameTime() % 40 == 0) ColonyData.regenFood(level); } private ColonyTicker() {} }
          __EOF__
          cat > src/main/java/com/realshrooms/GrazingHandler.java << '__EOF__'
          package com.realshrooms;
          import com.realshrooms.block.ShroomBlock; import net.minecraft.server.level.ServerLevel; import net.minecraft.world.entity.animal.Animal; import net.minecraft.world.entity.player.Player;
          public final class GrazingHandler {
              public static void tick(ServerLevel level) { if (!ShroomConfig.INSTANCE.animalsEnabled || level.getGameTime() % 100 != 0) return; for (Player p : level.players()) { var animals = level.getEntitiesOfClass(Animal.class, p.getBoundingBox().inflate(24), a -> a.isAlive() && a.getHealth() < a.getMaxHealth()); for (Animal a : animals) { var pos = a.blockPosition(); search: for (int dx = -5; dx <= 5; dx++) for (int dy = -1; dy <= 1; dy++) for (int dz = -5; dz <= 5; dz++) { var bp = pos.offset(dx, dy, dz); var bs = level.getBlockState(bp); if (bs.getBlock() instanceof ShroomBlock sb) { if (sb.species.edible) { a.heal(2); level.removeBlock(bp, false); break search; } else if (sb.species.effect != null) { a.addEffect(sb.species.effect.get()); level.removeBlock(bp, false); break search; } } } } } }
              private GrazingHandler() {}
          }
          __EOF__

      - name: Main and Debug
        run: |
          cat > src/main/java/com/realshrooms/DebugCommand.java << '__EOF__'
          package com.realshrooms;
          import com.mojang.brigadier.CommandDispatcher; import com.mojang.brigadier.arguments.IntegerArgumentType; import com.realshrooms.block.*; import net.minecraft.commands.CommandSourceStack; import net.minecraft.commands.Commands; import net.minecraft.core.BlockPos; import net.minecraft.core.Direction; import net.minecraft.core.particles.ParticleTypes; import net.minecraft.network.chat.Component; import net.minecraft.server.level.ServerLevel; import net.minecraft.server.level.ServerPlayer; import net.minecraft.world.level.block.Block; import java.util.*;
          public final class DebugCommand {
              public static void register(CommandDispatcher<CommandSourceStack> d) { d.register(Commands.literal("realshrooms").requires(src -> src.hasPermission(2)).then(Commands.literal("info").executes(ctx -> info(ctx.getSource()))).then(Commands.literal("size").executes(ctx -> size(ctx.getSource()))).then(Commands.literal("points").then(Commands.argument("amount", IntegerArgumentType.integer(-1000, 1000)).executes(ctx -> addPoints(ctx.getSource(), IntegerArgumentType.getInteger(ctx, "amount"))))).then(Commands.literal("kill").executes(ctx -> kill(ctx.getSource()))).then(Commands.literal("highlight").executes(ctx -> highlight(ctx.getSource())))); }
              private static BlockPos lookingAt(ServerPlayer p) { var hit = p.pick(16.0D, 0.5F, false); return hit instanceof net.minecraft.world.phys.BlockHitResult bhr ? bhr.getBlockPos() : p.blockPosition(); }
              private static ShroomSpecies speciesAt(ServerLevel lvl, BlockPos pos) { Block b = lvl.getBlockState(pos).getBlock(); if (b instanceof MyceliumHyphaBlock hy) return hy.species(); if (b instanceof MyceliumCoreBlock co) return co.species; if (b instanceof MyceliumNodeBlock no) return no.species; if (b instanceof ShroomBlock sb) return sb.species; return ShroomSpecies.CHANTERELLE; }
              private static boolean isMycelium(ServerLevel lvl, BlockPos pos) { Block b = lvl.getBlockState(pos).getBlock(); return b instanceof MyceliumHyphaBlock || b instanceof MyceliumCoreBlock || b instanceof MyceliumNodeBlock; }
              private static int info(CommandSourceStack src) { if (!(src.getEntity() instanceof ServerPlayer p)) return 0; ServerLevel lvl = (ServerLevel) p.level(); BlockPos pos = lookingAt(p); ShroomSpecies sp = speciesAt(lvl, pos); var c = ColonyData.merged(lvl, pos, sp); int sz = count(lvl, pos, sp); String strat = switch (c.strategy) { case 1 -> "Оборона"; case 2 -> "Війна"; case 3 -> "Голод"; default -> "Розширення"; }; src.sendSuccess(() -> Component.literal("Колонія [" + sp.displayName + "] точки: " + c.points + " | розмір: " + sz + " | E/F/R/A: " + c.expansion + "/" + c.fruiting + "/" + c.resistance + "/" + c.aggression + " (" + c.totalLevels() + "/" + ColonyData.MAX_TOTAL_LEVELS + ") | стратегія: " + strat), false); return 1; }
              private static int size(CommandSourceStack src) { if (!(src.getEntity() instanceof ServerPlayer p)) return 0; ServerLevel lvl = (ServerLevel) p.level(); BlockPos pos = lookingAt(p); ShroomSpecies sp = speciesAt(lvl, pos); int n = count(lvl, pos, sp); src.sendSuccess(() -> Component.literal("Розмір: " + n + " блоків " + sp.displayName), false); return 1; }
              private static int count(ServerLevel lvl, BlockPos start, ShroomSpecies sp) { Set<BlockPos> seen = new HashSet<>(); ArrayDeque<BlockPos> q = new ArrayDeque<>(); q.add(start); while (!q.isEmpty() && seen.size() < 4000) { BlockPos p = q.poll(); if (!seen.add(p) || p.distManhattan(start) > 128 || !isMycelium(lvl, p) || !speciesAt(lvl, p).equals(sp)) continue; for (Direction d : Direction.values()) q.add(p.relative(d)); } return seen.size(); }
              private static int addPoints(CommandSourceStack src, int amount) { if (!(src.getEntity() instanceof ServerPlayer p)) return 0; ServerLevel lvl = (ServerLevel) p.level(); BlockPos pos = lookingAt(p); ShroomSpecies sp = speciesAt(lvl, pos); ColonyData.addPoints(lvl, pos, sp, amount); src.sendSuccess(() -> Component.literal("Очки " + sp.displayName + " += " + amount), false); return 1; }
              private static int kill(CommandSourceStack src) { if (!(src.getEntity() instanceof ServerPlayer p)) return 0; ServerLevel lvl = (ServerLevel) p.level(); BlockPos pos = lookingAt(p); ShroomSpecies sp = speciesAt(lvl, pos); Set<BlockPos> seen = new HashSet<>(); ArrayDeque<BlockPos> q = new ArrayDeque<>(); q.add(pos); int killed = 0; while (!q.isEmpty() && killed < 4000) { BlockPos b = q.poll(); if (!seen.add(b) || b.distManhattan(pos) > 128 || !isMycelium(lvl, b) || !speciesAt(lvl, b).equals(sp)) continue; lvl.removeBlock(b, false); killed++; for (Direction d : Direction.values()) q.add(b.relative(d)); } final int k = killed; src.sendSuccess(() -> Component.literal("Вбито " + k + " блоків " + sp.displayName), false); return 1; }
              private static int highlight(CommandSourceStack src) { if (!(src.getEntity() instanceof ServerPlayer p)) return 0; ServerLevel lvl = (ServerLevel) p.level(); BlockPos pos = lookingAt(p); ShroomSpecies sp = speciesAt(lvl, pos); Set<BlockPos> seen = new HashSet<>(); ArrayDeque<BlockPos> q = new ArrayDeque<>(); q.add(pos); while (!q.isEmpty() && seen.size() < 2000) { BlockPos b = q.poll(); if (!seen.add(b) || b.distManhattan(pos) > 96 || !isMycelium(lvl, b) || !speciesAt(lvl, b).equals(sp)) continue; lvl.sendParticles(ParticleTypes.END_ROD, b.getX() + 0.5, b.getY() + 1.05, b.getZ() + 0.5, 1, 0, 0, 0, 0); for (Direction d : Direction.values()) q.add(b.relative(d)); } final int n = seen.size(); src.sendSuccess(() -> Component.literal("Підсвічено " + n + " блоків"), false); return 1; }
              private DebugCommand() {}
          }
